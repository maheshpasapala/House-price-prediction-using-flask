name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install dependencies
        run: python -m pip install -r requirement.txt pytest

      - name: Run tests
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag house-price-prediction:ci .

      - name: Smoke test container
        run: |
          docker run --detach --name house-price-prediction-ci --publish 5000:5000 house-price-prediction:ci
          trap 'docker logs house-price-prediction-ci; docker rm --force house-price-prediction-ci' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 --retry-connrefused http://127.0.0.1:5000/