apiVersion: apps/v1
kind: Deployment
metadata:
  name: house-price-prediction
  labels:
    app: house-price-prediction
spec:
  replicas: 2
  selector:
    matchLabels:
      app: house-price-prediction
  template:
    metadata:
      labels:
        app: house-price-prediction
    spec:
      containers:
        - name: house-price-prediction
          image: house-price-prediction:ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: house-price-prediction
spec:
  selector:
    app: house-price-prediction
  ports:
    - name: http
      port: 80
      targetPort: http
  type: LoadBalancer
